<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>員工薪水鈔票換算器</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-labelledby="app-title">
        <header class="workspace-header">
          <div>
            <p class="eyebrow">Payroll Cash Desk</p>
            <h1 id="app-title">員工薪水鈔票換算器</h1>
          </div>
          <div class="status-pill" aria-live="polite">
            <span class="status-dot"></span>
            單一員工換算
          </div>
        </header>

        <div class="tool-grid">
          <section class="control-panel" aria-label="薪水與優先面額">
            <div class="section-heading">
              <span class="step-mark">1</span>
              <div>
                <h2>設定發放條件</h2>
                <p>先選優先發放的鈔票，再輸入薪水金額。</p>
              </div>
            </div>

            <form class="salary-form" id="salary-form" novalidate>
              <label for="salary-input">員工薪水</label>
              <div class="money-input">
                <span aria-hidden="true">$</span>
                <input
                  id="salary-input"
                  name="salary"
                  type="number"
                  min="10000"
                  step="10000"
                  inputmode="numeric"
                  placeholder="280000"
                  autocomplete="off"
                />
              </div>

              <fieldset class="denomination-field">
                <legend>優先發放面額</legend>
                <div class="denomination-group" aria-label="選擇優先發放面額">
                  <button
                    class="denomination-button is-selected"
                    type="button"
                    data-denomination="100000"
                    aria-pressed="true"
                  >
                    <span class="bill-label">10萬</span>
                    <span class="bill-value">$100,000</span>
                  </button>
                  <button
                    class="denomination-button"
                    type="button"
                    data-denomination="50000"
                    aria-pressed="false"
                  >
                    <span class="bill-label">5萬</span>
                    <span class="bill-value">$50,000</span>
                  </button>
                  <button
                    class="denomination-button"
                    type="button"
                    data-denomination="20000"
                    aria-pressed="false"
                  >
                    <span class="bill-label">2萬</span>
                    <span class="bill-value">$20,000</span>
                  </button>
                  <button
                    class="denomination-button"
                    type="button"
                    data-denomination="10000"
                    aria-pressed="false"
                  >
                    <span class="bill-label">1萬</span>
                    <span class="bill-value">$10,000</span>
                  </button>
                </div>
              </fieldset>

              <p class="hint" id="priority-hint">目前優先發放：10萬元。請輸入 10000 元的倍數。</p>
              <p class="message" id="message" role="alert"></p>

              <button class="calculate-button" type="submit">換算鈔票</button>
            </form>
          </section>

          <section class="result-panel" aria-label="換算結果">
            <div class="section-heading">
              <span class="step-mark">2</span>
              <div>
                <h2>發放明細</h2>
                <p>依照目前優先面額計算每種鈔票張數。</p>
              </div>
            </div>

            <div class="summary-card">
              <span>合計薪水</span>
              <strong id="summary-total">$0</strong>
            </div>

            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>面額</th>
                    <th>張數</th>
                    <th>小計</th>
                  </tr>
                </thead>
                <tbody id="result-body">
                  <tr class="empty-row">
                    <td colspan="3">輸入薪水後會顯示換算結果</td>
                  </tr>
                </tbody>
                <tfoot>
                  <tr>
                    <th scope="row" colspan="2">合計</th>
                    <td id="total-cell">$0</td>
                  </tr>
                </tfoot>
              </table>
            </div>
          </section>
        </div>
      </section>
    </main>
  </body>
</html>
