<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>員工薪水鈔票換算器</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-labelledby="app-title">
        <header class="workspace-header">
          <div>
            <p class="eyebrow">Payroll Cash Desk</p>
            <h1 id="app-title">員工薪水鈔票換算器</h1>
          </div>
          <div class="status-pill" aria-live="polite">
            <span class="status-dot"></span>
            單一員工換算
          </div>
        </header>

        <div class="tool-grid">
          <section class="control-panel" aria-label="薪水與面額設定">
            <div class="section-heading">
              <span class="step-mark">1</span>
              <div>
                <h2>設定發放條件</h2>
                <p>輸入薪水與已指定張數，空白面額會自動補足剩餘金額。</p>
              </div>
            </div>

            <form class="salary-form" id="salary-form" novalidate>
              <label for="salary-input">薪水總額</label>
              <div class="money-input">
                <span aria-hidden="true">$</span>
                <input
                  id="salary-input"
                  name="salary"
                  type="number"
                  min="10000"
                  step="10000"
                  inputmode="numeric"
                  placeholder="3000000"
                  autocomplete="off"
                />
              </div>

              <fieldset class="denomination-field">
                <legend>各面額手動張數</legend>
                <div class="denomination-group" aria-label="設定各面額手動張數">
                  <article class="denomination-card is-selected" data-denomination-card="100000">
                    <button
                      class="denomination-button"
                      type="button"
                      data-denomination="100000"
                      aria-pressed="true"
                    >
                      <span class="bill-label">10萬</span>
                      <span class="bill-value">$100,000</span>
                    </button>
                    <label class="count-field">
                      <span>手動張數</span>
                      <input
                        class="manual-count-input"
                        type="number"
                        min="0"
                        step="1"
                        inputmode="numeric"
                        placeholder="自動"
                        data-manual-count="100000"
                      />
                    </label>
                  </article>

                  <article class="denomination-card" data-denomination-card="50000">
                    <button
                      class="denomination-button"
                      type="button"
                      data-denomination="50000"
                      aria-pressed="false"
                    >
                      <span class="bill-label">5萬</span>
                      <span class="bill-value">$50,000</span>
                    </button>
                    <label class="count-field">
                      <span>手動張數</span>
                      <input
                        class="manual-count-input"
                        type="number"
                        min="0"
                        step="1"
                        inputmode="numeric"
                        placeholder="自動"
                        data-manual-count="50000"
                      />
                    </label>
                  </article>

                  <article class="denomination-card" data-denomination-card="20000">
                    <button
                      class="denomination-button"
                      type="button"
                      data-denomination="20000"
                      aria-pressed="false"
                    >
                      <span class="bill-label">2萬</span>
                      <span class="bill-value">$20,000</span>
                    </button>
                    <label class="count-field">
                      <span>手動張數</span>
                      <input
                        class="manual-count-input"
                        type="number"
                        min="0"
                        step="1"
                        inputmode="numeric"
                        placeholder="自動"
                        data-manual-count="20000"
                      />
                    </label>
                  </article>

                  <article class="denomination-card" data-denomination-card="10000">
                    <button
                      class="denomination-button"
                      type="button"
                      data-denomination="10000"
                      aria-pressed="false"
                    >
                      <span class="bill-label">1萬</span>
                      <span class="bill-value">$10,000</span>
                    </button>
                    <label class="count-field">
                      <span>手動張數</span>
                      <input
                        class="manual-count-input"
                        type="number"
                        min="0"
                        step="1"
                        inputmode="numeric"
                        placeholder="自動"
                        data-manual-count="10000"
                      />
                    </label>
                  </article>
                </div>
              </fieldset>

              <p class="hint" id="priority-hint">
                目前優先自動補足：10萬元。未輸入張數的面額會自動使用。
              </p>
              <p class="message" id="message" role="alert"></p>

              <button class="calculate-button" type="submit">換算鈔票</button>
            </form>
          </section>

          <section class="result-panel" aria-label="換算結果">
            <div class="section-heading">
              <span class="step-mark">2</span>
              <div>
                <h2>發放明細</h2>
                <p>先扣除手動張數，再用剩下面額自動補足薪水。</p>
              </div>
            </div>

            <div class="summary-grid">
              <div class="summary-card">
                <span>薪水總額</span>
                <strong id="summary-total">$0</strong>
              </div>
              <div class="summary-card subtle">
                <span>手動指定</span>
                <strong id="manual-total">$0</strong>
              </div>
              <div class="summary-card subtle">
                <span>自動補足</span>
                <strong id="auto-total">$0</strong>
              </div>
            </div>

            <div class="remaining-card" id="remaining-card" hidden>
              <span>尚未補足</span>
              <strong id="remaining-total">$0</strong>
            </div>

            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>面額</th>
                    <th>手動</th>
                    <th>自動</th>
                    <th>合計</th>
                    <th>小計</th>
                  </tr>
                </thead>
                <tbody id="result-body">
                  <tr class="empty-row">
                    <td colspan="5">輸入薪水後會顯示換算結果</td>
                  </tr>
                </tbody>
                <tfoot>
                  <tr>
                    <th scope="row" colspan="4">合計</th>
                    <td id="total-cell">$0</td>
                  </tr>
                </tfoot>
              </table>
            </div>
          </section>
        </div>
      </section>
    </main>
  </body>
</html>
